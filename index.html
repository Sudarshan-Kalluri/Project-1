<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101426" />
    <title>Hello, Sudarshan!</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=DM+Mono&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap");

      :root { color-scheme: dark; }
      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        overflow: hidden;
        background: #101426;
        color: #f8f7ff;
        font-family: "DM Sans", sans-serif;
      }

      .glow {
        position: fixed;
        width: 38rem;
        aspect-ratio: 1;
        border-radius: 50%;
        filter: blur(7rem);
        opacity: .45;
        pointer-events: none;
      }
      .glow-one { background: #8b5cf6; top: -18rem; left: -11rem; }
      .glow-two { background: #0ea5e9; bottom: -21rem; right: -12rem; }

      main {
        width: min(90vw, 740px);
        padding: clamp(2.25rem, 7vw, 5rem);
        position: relative;
        border: 1px solid rgba(255,255,255,.18);
        border-radius: 28px;
        background: linear-gradient(135deg, rgba(255,255,255,.14), rgba(255,255,255,.04));
        box-shadow: 0 28px 90px rgba(0,0,0,.34), inset 0 1px rgba(255,255,255,.16);
        backdrop-filter: blur(20px);
        animation: enter .9s cubic-bezier(.2,.8,.2,1) both;
      }

      .eyebrow {
        display: flex;
        align-items: center;
        gap: .7rem;
        margin: 0 0 2rem;
        color: #c8c6ff;
        font: .75rem/1 "DM Mono", monospace;
        letter-spacing: .14em;
        text-transform: uppercase;
      }
      .dot { width: .55rem; height: .55rem; border-radius: 50%; background: #71f2b3; box-shadow: 0 0 14px #71f2b3; }

      h1 {
        max-width: 8ch;
        margin: 0;
        font: 700 clamp(3.5rem, 11vw, 7.25rem)/.92 "Playfair Display", serif;
        letter-spacing: -.07em;
      }
      h1 em { color: #b9a4ff; font-weight: 600; }

      p {
        max-width: 37ch;
        margin: 2rem 0 0;
        color: #d8d8e8;
        font-size: clamp(1rem, 2vw, 1.15rem);
        line-height: 1.65;
      }

      .signature {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        margin-top: 3.5rem;
        color: #a9a9c2;
        font: .72rem/1 "DM Mono", monospace;
        letter-spacing: .08em;
        text-transform: uppercase;
      }
      .line { height: 1px; flex: 1; background: linear-gradient(90deg, rgba(255,255,255,.28), transparent); }

      @keyframes enter {
        from { opacity: 0; transform: translateY(24px) scale(.98); }
        to { opacity: 1; transform: translateY(0) scale(1); }
      }
    </style>
  </head>
  <body>
    <div class="glow glow-one"></div>
    <div class="glow glow-two"></div>
    <main>
      <div class="eyebrow"><span class="dot"></span> A small beginning</div>
      <h1>Hello, <em>World.</em></h1>
      <p>One line of code, an infinite number of possibilities. Welcome to your next great idea.</p>
      <div class="signature"><span>Made with curiosity</span><span class="line"></span><span>01 — 01</span></div>
    </main>
  </body>
</html>
